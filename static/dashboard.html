<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Dashboard - Autodetect</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      /* Additional styles for Dashboard card layout */
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }
      .card-header {
        padding: 16px;
        background: #f8fafc;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .card-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin: 0;
      }
      .card-subtitle {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .card-body {
        padding: 16px;
        flex-grow: 1;
      }
      .channel-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .chan-block {
        aspect-ratio: 1.2;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: bold;
        transition: background-color 0.2s;
        border: 1px solid transparent;
      }
      .chan-block.online {
        background: #dcfce7;
        color: var(--ok);
        border-color: #bbf7d0;
      }
      .chan-block.loss {
        background: #fee2e2;
        color: var(--bad);
        border-color: #fca5a5;
      }
      .chan-block.offline {
        background: #f1f5f9;
        color: #94a3b8;
        border-color: #e2e8f0;
      }
      .chan-num {
        font-size: 14px;
        margin-bottom: 2px;
      }
      .chan-status-text {
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .card-footer {
        padding: 12px 16px;
        background: #f8fafc;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
      .card-footer div {
        margin-bottom: 4px;
      }
      .card-footer div:last-child {
        margin-bottom: 0;
      }
      .btn-danger-outline {
        background: transparent;
        color: var(--bad);
        border: 1px solid var(--bad);
        height: 28px;
        padding: 0 8px;
        font-size: 11px;
        border-radius: 4px;
        font-weight: bold;
      }
      .btn-danger-outline:hover {
        background: var(--bad);
        color: #fff;
      }
      .nav-links {
        display: flex;
        gap: 12px;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
      }
      .btn-outline:hover {
        background: var(--accent);
        color: #fff;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        background-color: var(--ok);
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
        box-shadow: 0 0 0 0 rgba(21, 128, 61, 0.7);
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(21, 128, 61, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 6px rgba(21, 128, 61, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(21, 128, 61, 0);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Camera Dashboard</h1>
          <p>Confirmed IP Cameras & Real-time Live Signal Status</p>
        </div>
        <div class="nav-links">
          <a href="/index.html"><button type="button" class="btn-outline">Back to Network Scan</button></a>
          <button id="refreshAllButton" type="button">Refresh All Streams</button>
        </div>
      </header>

      <section class="toolbar" style="grid-template-columns: auto 1fr;">
        <div>
          <span class="pulse-dot"></span><strong>Dashboard Overview</strong>
        </div>
        <div style="text-align: right; color: var(--muted); font-size: 13px;" id="dashboardStatus">
          Loaded 0 devices
        </div>
      </section>

      <div class="dashboard-grid" id="dashboardGrid">
        <!-- Cards will be populated here -->
        <div class="empty-row" style="grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 48px; text-align: center; color: var(--muted);">
          <h3>ยังไม่มีกล้องในแดชบอร์ด</h3>
          <p>กลับไปที่หน้าสแกนเครือข่าย แล้วกด "➕ Add to Dashboard" บนกล้องที่สแกนเจอ</p>
        </div>
      </div>
    </main>
    <script src="/dashboard.js"></script>
  </body>
</html>
